name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality + retrieval gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Packaging smoke test
        run: |
          python -m build
          python -m venv --system-site-packages /tmp/rag-wheel-check
          /tmp/rag-wheel-check/bin/python -m pip install \
            --force-reinstall --no-deps dist/*.whl
          cd /tmp
          /tmp/rag-wheel-check/bin/rag-eval
          /tmp/rag-wheel-check/bin/rag-eval-compare
          test -s /tmp/reports/latest.json
          test -s /tmp/reports/ablation.json

      - name: Lint and format check
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Tests and coverage
        run: make test

      - name: Application retrieval quality gate + ablation
        run: make eval-ci

      - name: Publish evaluation summary
        if: always() && hashFiles('reports/ablation.md') != ''
        run: cat reports/ablation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            coverage.xml
            reports/*.md
            reports/*.json

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Run Compose ingestion and query smoke test
        run: |
          export COMPOSE_PROJECT_NAME="rag-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker compose down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT
          docker compose up --detach --build
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs --no-color api qdrant
              exit 1
            fi
            sleep 1
          done
          test "$(docker compose exec -T api id -u)" = "10001"
          curl --fail --silent --show-error \
            --form "file=@data/sample_docs/operations.md" \
            http://127.0.0.1:8000/ingest > /tmp/ingest.json
          curl --fail --silent --show-error \
            --header "Content-Type: application/json" \
            --data '{"question":"Which services does Docker Compose start?","top_k":3}' \
            http://127.0.0.1:8000/query > /tmp/query.json
          python - <<'PY'
          import json
          from pathlib import Path

          ingest = json.loads(Path("/tmp/ingest.json").read_text())
          query = json.loads(Path("/tmp/query.json").read_text())
          assert ingest["chunks"] > 0
          assert query["retrieval"]["strategy"] == "hybrid"
          assert query["retrieval"]["abstained"] is False
          assert query["citations"]
          PY
